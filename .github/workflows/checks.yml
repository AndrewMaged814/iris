name: Repository checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reader and doctor dependencies
        run: python -m pip install 'extruct>=0.18,<0.19' 'price-parser>=0.5,<0.6' PyYAML python-dotenv
      - name: Run offline contracts
        run: python -m unittest discover -s tests
      - name: Validate the distribution
        run: python tools/validate_repo.py
