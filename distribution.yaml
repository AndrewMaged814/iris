name: iris
version: 1.2.0
description: "Your AI market watcher in Telegram. Iris connects competitor activity, public market research and your store's context so you can see what matters, investigate opportunities and choose your next move."
author: "Andrew Maged"
hermes_requires: ">=0.21.3"
repository: "https://github.com/AndrewMaged814/iris"
distribution_owned:
  - distribution.yaml
  - SOUL.md
  - config.yaml
  - skills
  - plugins
  - scripts
notes:
  - "One profile per store. Composio authorization, the owner's Telegram ID and Iris's data stay on the host."
  - "Run scripts/setup_jobs.sh once after install to create the daily watch, morning offer check and weekly brief."
