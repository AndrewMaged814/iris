# Iris — one Hermes profile per store. The operator picks the model with `hermes -p iris setup`.
model: ""

# Scheduled jobs use this time zone ("0 8 * * *" = 8:00 in Cairo).
timezone: "Africa/Cairo"

# Native Hermes delivery: the owner's reply can refer back to a scheduled alert.
cron:
  mirror_delivery: true
  wrap_response: false

# Tools Iris may use in chat and in scheduled runs. Terminal, files, messaging and cron scheduling
# stay off. Local browser calls are temporarily excluded after navigation/daemon failures.
# Native web extraction and vision remain available; the browser guard remains for later recovery.
# Connected app actions use native Composio; scheduled market checks only read apps.
platform_toolsets:
  telegram:
    - iris
    - web             # native web_search + web_extract for discovery and linked page evidence
    - vision          # reading screenshots
    - memory          # Hermes' built-in memory: USER.md (the owner) and MEMORY.md (Iris's notes)
    - iris-skill-read
    - composio
  cron:              # no memory here: scheduled runs read other websites, so they can't write memory
    - iris
    - web            # native research for the morning offer check and current evidence
    - iris-skill-read
    - composio
known_plugin_toolsets:
  telegram: [iris]
  cron: [iris]

plugins:
  enabled:
    - iris

agent:
  max_turns: 20
  disabled_toolsets:
    - terminal
    - file
    - delegation
    - messaging
    - cronjob
    - code_execution
    - connections

tools:
  tool_search:
    enabled: false

# Enable after native Hermes OAuth login; credentials remain in the profile token store.
mcp_servers:
  composio:
    enabled: false
    url: https://connect.composio.dev/mcp
    auth: oauth
    tools:
      include:
        - COMPOSIO_SEARCH_TOOLS
        - COMPOSIO_GET_TOOL_SCHEMAS
        - COMPOSIO_MANAGE_CONNECTIONS
        - COMPOSIO_WAIT_FOR_CONNECTIONS
        - COMPOSIO_MULTI_EXECUTE_TOOL
      prompts: false
      resources: false

# Research uses Hermes's native provider selection, extraction, cache and fallback.
# Configure the profile through `hermes -p iris tools`; Iris does not pin a search service.

# Dormant local browser settings for recovery: no cloud browser, no Camofox fingerprint spoofing,
# no Browser Use code execution. AGENT_BROWSER_ARGS in .env sets Iris's honest user agent.
browser:
  cloud_provider: local
  backend: "off"          # built-in read tools, not browser_exec
  inactivity_timeout: 120

# Native Telegram feedback: an "eyes" reaction while Iris works, then thumbs up when delivered
# (thumbs down on failure). Hermes also delivers Iris's natural mid-turn updates as messages.
telegram:
  reactions: true

display:
  interim_assistant_messages: true
  platforms:
    telegram:
      tool_progress: "all"
      tool_progress_grouping: "accumulate"  # native editable activity bubble
      tool_preview_length: 0                # activity names without argument previews
      cleanup_progress: true               # remove activity after successful final delivery
