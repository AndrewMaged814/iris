# Iris — one Hermes profile per store. The operator picks the model with `hermes -p iris setup`.
model: ""

# Scheduled jobs use this time zone ("0 8 * * *" = 8:00 in Cairo).
timezone: "Africa/Cairo"

# Native Hermes delivery: the owner's reply can refer back to a scheduled alert.
cron:
  mirror_delivery: true
  wrap_response: false

# Tools Iris may use in chat and in scheduled runs. Terminal, files, messaging and cron scheduling
# stay off. The browser is chat-only and read-only: the Iris plugin's pre_tool_call guard blocks
# clicks, typing, consoles and the vault, and robots.txt-disallowed or private addresses.
# Fixed offer writes require the live owner's private Telegram approval;
# scheduled runs can read/propose but cannot execute them.
platform_toolsets:
  telegram:
    - iris
    - web             # native web_search + web_extract for discovery and linked page evidence
    - browser         # renders pages that only show products after JavaScript runs
    - vision          # reading screenshots
    - memory          # Hermes' built-in memory: USER.md (the owner) and MEMORY.md (Iris's notes)
    - iris-skill-read
    - no_mcp
  cron:              # no memory here: scheduled runs read other websites, so they can't write memory
    - iris
    - iris-skill-read
    - no_mcp
known_plugin_toolsets:
  telegram: [iris]
  cron: [iris]

plugins:
  enabled:
    - iris

agent:
  max_turns: 20
  disabled_toolsets:
    - terminal
    - file
    - delegation
    - messaging
    - cronjob
    - code_execution
    - connections

tools:
  tool_search:
    enabled: false

# Free, self-hosted competitor search: SearXNG at SEARXNG_URL (see docs/SETUP.md). Hermes uses
# this exact backend with no fallback, so search fails visibly if SearXNG is down. web_extract is
# not affected and keeps Hermes' own backend selection.
web:
  search_backend: searxng

# Hermes's own headless Chromium on this host: no cloud browser, no Camofox fingerprint spoofing,
# no Browser Use code execution. AGENT_BROWSER_ARGS in .env sets Iris's honest user agent.
browser:
  cloud_provider: local
  backend: "off"          # built-in read tools, not browser_exec
  inactivity_timeout: 120

# Native Telegram feedback: an "eyes" reaction while Iris works, then thumbs up when delivered
# (thumbs down on failure). Hermes also delivers Iris's natural mid-turn updates as messages.
telegram:
  reactions: true

display:
  interim_assistant_messages: true
  platforms:
    telegram:
      tool_progress: "off"   # owners never see tool names; Iris writes her own progress lines
