<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Iris system architecture</title>
  <desc id="desc">An SME owner talks to Iris through Telegram. Hermes runs the agent, Iris profile, memory, delivery and scheduled checks. Iris observes a market signal, investigates evidence, compares it with the owner's products, recommends a response and follows up on chosen moves. Native Hermes web research reads competitor product pages. Native Composio reads the connected catalog and handles owner-requested app actions with readback. Iris stores selected product snapshots and changes in local SQLite. The owner decides what to do and the weekly review feeds the next decision.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172033; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #667085; }
      .title { font-size: 28px; font-weight: 700; }
      .heading { font-size: 22px; font-weight: 700; }
      .body { font-size: 16px; fill: #475467; }
      .small { font-size: 14px; fill: #667085; }
      .step { font-size: 17px; font-weight: 600; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="690" rx="16" fill="#ffffff"/>
  <rect x="1" y="1" width="1198" height="688" rx="15" fill="none" stroke="#e3e8ef" stroke-width="2"/>
  <text class="eyebrow" x="46" y="48">IRIS / SYSTEM ARCHITECTURE</text>
  <text class="title" x="46" y="86">A market signal becomes a decision for your store</text>
  <line x1="46" y1="111" x2="1154" y2="111" stroke="#e4e7ec" stroke-width="2"/>

  <!-- All connectors sit behind the components. -->
  <path class="arrow" d="M 228 253 H 257"/>
  <path class="arrow" d="M 257 278 H 229"/>
  <path class="arrow" d="M 448 253 H 477"/>
  <path class="arrow" d="M 477 278 H 449"/>
  <path class="arrow" d="M 826 254 H 878"/>
  <path class="arrow" d="M 878 278 H 836"/>
  <path class="arrow" d="M 826 354 H 878"/>
  <path class="arrow" d="M 878 378 H 836"/>
  <path class="arrow" d="M 826 454 H 878"/>
  <path class="arrow" d="M 878 478 H 836"/>

  <!-- The owner communicates through Telegram; Telegram is not the agent. -->
  <rect x="46" y="210" width="176" height="108" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="46" y="210" width="176" height="7" rx="3" fill="#94a3b8"/>
  <text class="heading" x="64" y="256">SME owner</text>
  <text class="body" x="64" y="282">Asks · chooses</text>
  <text class="body" x="64" y="303">reports outcomes</text>

  <rect x="264" y="210" width="178" height="108" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="264" y="210" width="178" height="7" rx="3" fill="#2aabee"/>
  <text class="heading" x="282" y="256">Telegram</text>
  <text class="body" x="282" y="282">Chat · alerts</text>
  <text class="body" x="282" y="303">weekly briefs</text>

  <!-- Hermes hosts the agent; Iris is the business profile within it. -->
  <rect x="484" y="142" width="359" height="405" rx="12" fill="#f8f7fd" stroke="#9b8bd0" stroke-width="2"/>
  <rect x="484" y="142" width="359" height="7" rx="3" fill="#6653ad"/>
  <text class="heading" x="508" y="178">Hermes agent runtime</text>
  <text class="body" x="508" y="202">Model · Telegram · memory · schedules</text>

  <rect x="508" y="222" width="311" height="265" rx="9" fill="#ffffff" stroke="#b6a8e0" stroke-width="2"/>
  <text class="heading" x="530" y="259">Iris profile</text>
  <text class="small" x="530" y="283">Business skills + three market tools</text>
  <line x1="531" y1="310" x2="531" y2="448" stroke="#d6cff0" stroke-width="2"/>
  <circle cx="531" cy="315" r="10" fill="#6653ad"/>
  <circle cx="531" cy="358" r="10" fill="#6653ad"/>
  <circle cx="531" cy="401" r="10" fill="#6653ad"/>
  <circle cx="531" cy="444" r="10" fill="#6653ad"/>
  <text class="step" x="554" y="320">Observe a market signal</text>
  <text class="step" x="554" y="363">Investigate the evidence</text>
  <text class="step" x="554" y="406">Compare with your products</text>
  <text class="step" x="554" y="449">Recommend one next move</text>

  <rect x="508" y="500" width="311" height="35" rx="7" fill="#ece9f7"/>
  <text class="small" x="526" y="523">Daily watch · offer check · weekly brief</text>

  <!-- Iris consults native research, connected apps and its own watch history. -->
  <text class="eyebrow" x="885" y="190">RESEARCH, APPS &amp; HISTORY</text>

  <rect x="885" y="222" width="269" height="88" rx="9" fill="#ffffff" stroke="#aab9d4" stroke-width="2"/>
  <rect x="885" y="222" width="6" height="88" rx="3" fill="#5070b3"/>
  <text class="heading" x="907" y="256">Hermes web</text>
  <text class="body" x="907" y="281">Competitor product pages</text>
  <text class="small" x="907" y="299">Search · extraction · vision</text>

  <rect x="885" y="322" width="269" height="88" rx="9" fill="#ffffff" stroke="#90c4c4" stroke-width="2"/>
  <rect x="885" y="322" width="6" height="88" rx="3" fill="#138c93"/>
  <text class="heading" x="907" y="356">Composio</text>
  <text class="body" x="907" y="381">Catalog reads + app actions</text>
  <text class="small" x="907" y="399">Requested writes + readback</text>

  <rect x="885" y="422" width="269" height="88" rx="9" fill="#ffffff" stroke="#c0b5de" stroke-width="2"/>
  <rect x="885" y="422" width="6" height="88" rx="3" fill="#8c79bb"/>
  <text class="heading" x="907" y="456">Iris watch history</text>
  <text class="body" x="907" y="481">Selected product snapshots</text>
  <text class="small" x="907" y="499">Changes · local SQLite</text>

  <!-- Product feedback loop. The owner decides; Iris does not act from a signal alone. -->
  <rect x="46" y="582" width="1108" height="78" rx="10" fill="#f7fafc" stroke="#d7dee8" stroke-width="2"/>
  <text class="eyebrow" x="64" y="605">THE CONTINUING LOOP</text>
  <text class="step" x="82" y="635">Detect</text>
  <text class="step" x="300" y="635">Investigate</text>
  <text class="step" x="558" y="635">Decide</text>
  <text class="step" x="745" y="635">Owner chooses</text>
  <text class="step" x="1008" y="635">Review</text>
  <path class="arrow" d="M 154 630 H 276"/>
  <path class="arrow" d="M 409 630 H 535"/>
  <path class="arrow" d="M 620 630 H 719"/>
  <path class="arrow" d="M 879 630 H 979"/>
  <path class="arrow" d="M 1071 643 V 650 H 85 V 643"/>
</svg>
